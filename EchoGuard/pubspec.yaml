name: echoguard
description: Offline-first environmental sound event monitoring for Android.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  record: ^6.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.5
  fl_chart: ^0.70.2
  tflite_flutter: ^0.11.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/labels/
